<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;background-color:#030303;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="Play Mineral v2" />
		<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.8, 1.8.8, mineral, mantle" />
		<title>Mineral v2</title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Mineral v2" />
		<meta property="og:description" content="Play Mineral v2" />
		<meta property="og:image" content="favicon.png" />
		<link type="image/png" rel="shortcut icon" href="favicon.png" />

		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							zinc: {
								950: '#060608',
								900: '#111115',
								800: '#191922',
								700: '#252530',
								400: '#a1a1aa',
								500: '#71717a'
							},
							brand: {
								cyan: '#00F5FF',
								blue: '#0038FF'
							}
						}
					}
				}
			}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
		<style>
			body {
				font-family: 'Neue Haas Grotesk Text Pro', 'Plus Jakarta Sans', 'Onest', -apple-system, sans-serif;
				background-color: #030303;

				/* Deeply extended and smoothed top-down color fade to remove harsh lines */
				background-image:
					radial-gradient(ellipse 160% 75% at 50% -20%, rgba(0, 245, 255, 0.14) 0%, rgba(0, 56, 255, 0.06) 45%, rgba(0, 56, 255, 0.01) 75%, rgba(3, 3, 3, 0) 100%),
					radial-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 0);
				background-size: 100% 100%, 20px 20px;
			}

			.title-font {
				font-family: 'Neue Haas Grotesk Display Pro', 'Plus Jakarta Sans', sans-serif;
				font-weight: 800;
				letter-spacing: -0.04em;
			}

			/* Custom smooth scrollbar behavior matching premium dashboard panels */
			.custom-scrollbar {
				scroll-behavior: smooth;
			}
			.custom-scrollbar::-webkit-scrollbar {
				width: 5px;
			}
			.custom-scrollbar::-webkit-scrollbar-track {
				background: transparent;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb {
				background: #191922;
				border-radius: 99px;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb:hover {
				background: #252530;
			}
		</style>

		<script type="text/javascript" src="bootstrap.js"></script>
		<script type="text/javascript">
			"use strict";

			// =========================================================================
			// EASY CHANGELOG CONFIGURATION
			// Simply add or modify entries here. The launcher will safely render them
			// and dynamically scale the opacity fade downward for older updates.
			// =========================================================================
			var CHANGELOG_DATA = [
				{
					version: "2.0.0",
					date: "June 16, 2026",
					notes: [
						"Migrated codebase to support Astra Client v2 features.",
						"Redesigned desktop launcher portal for direct initialization.",
						"Configured optimized asset delivery pipelines using assets.epw.",
						"Updated core relay assignments for online connectivity."
					]
				},
				{
					version: "1.4.0",
					date: "Mar 4, 2026",
					notes: [
						"Updated UI layout structure.",
						"Improved canvas scaling across broad aspect ratios."
					]
				},
				{
					version: "1.3.0",
					date: "Jan 14, 2026",
					notes: [
						"Refined version badge display inside headers.",
						"Finalized base game canvas layouts."
					]
				},
				{
					version: "1.2.0",
					date: "Dec 10, 2025",
					notes: [
						"Optimized asset unpack mechanics to reduce load stalls."
					]
				}
			];

			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				} else {

					// %%%%%%%%% launch options %%%%%%%%%%%%

					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epw",
						worldsDB: "worlds",
						servers: [
							/* example: { addr: "ws://localhost:8081/", name: "Local test server" } */
						],
						relays: [
							{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
							{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
							{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
						]
					};

					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

					var q = window.location.search;
					if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
						q = new window.URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}

					// Launch handler
					document.getElementById("launch-btn").addEventListener("click", function() {
						document.getElementById("launcher-ui").classList.add("hidden");
						main();
					});
				}
			});
		</script>
	</head>

	<body style="margin:0px;width:100%;height:100%;overflow:hidden;" id="game_frame">

		<div id="launcher-ui" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-4 overflow-hidden select-none">

			<div class="mb-6 flex justify-center">
				<img src="https://mantleassets.vercel.app/logo.png" alt="Mineral Logo" class="h-25 w-auto object-contain" />
			</div>

			<div class="w-full max-w-[920px] bg-zinc-950/75 border border-zinc-900/80 rounded-xl p-6 flex flex-col max-h-[82vh] backdrop-blur-xl shadow-2xl transition-all duration-300">

				<div class="flex items-start justify-between mb-4">
					<div>
						<h1 class="text-2xl title-font tracking-tight text-white uppercase">Mineral</h1>
						<p class="text-xs text-zinc-500 mt-0.5 font-medium">A Minecraft 1.8.8 web client by Mantle.</p>
					</div>
					<span class="text-xs font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 px-2.5 py-0.5 rounded-md">v2.0.0</span>
				</div>

				<hr class="border-zinc-900/60 my-2" />

				<div class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-6 min-h-0 my-3">

					<div class="md:col-span-7 flex flex-col min-h-0">
						<div class="mb-2">
							<h3 class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Update History</h3>
						</div>
						<div id="dynamic-changelog" class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar transition-all duration-500">
							<script type="text/javascript">
								if (typeof CHANGELOG_DATA !== 'undefined' && CHANGELOG_DATA.length > 0) {
									var htmlBuffer = "";
									for (var i = 0; i < CHANGELOG_DATA.length; i++) {
										var entry = CHANGELOG_DATA[i];

										// Smoothly stepping down opacity markers for structural depth
										var opacityClass = "opacity-100";
										if (i === 1) opacityClass = "opacity-75";
										if (i === 2) opacityClass = "opacity-50";
										if (i >= 3) opacityClass = "opacity-35";

										htmlBuffer += '<div class="rounded-lg border border-zinc-900 bg-zinc-900/20 p-4 space-y-2 transform transition-all duration-300 hover:border-zinc-800/80 ' + opacityClass + '">';
										htmlBuffer += '  <div class="flex items-center justify-between">';
										htmlBuffer += '    <span class="text-sm font-semibold text-white">' + entry.version + '</span>';
										htmlBuffer += '    <span class="text-xs text-zinc-500 font-medium">' + entry.date + '</span>';
										htmlBuffer += '  </div>';
										htmlBuffer += '  <ul class="list-disc list-inside text-xs text-zinc-400 space-y-1.5 pl-1 font-medium">';

										for (var j = 0; j < entry.notes.length; j++) {
											htmlBuffer += '    <li>' + entry.notes[j] + '</li>';
										}

										htmlBuffer += '  </ul>';
										htmlBuffer += '</div>';
									}
									document.write(htmlBuffer);
								} else {
									document.write('<p class="text-xs text-zinc-500 font-medium p-2">No client updates found.</p>');
								}
							</script>
						</div>
					</div>

					<div class="md:col-span-5 flex flex-col justify-between border-t md:border-t-0 md:border-l border-zinc-900/60 pt-4 md:pt-0 md:pl-6 min-h-0">
						<div class="space-y-3">
							<div>
								<h3 class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Default Client Keybinds</h3>
							</div>

							<div class="space-y-2 text-xs font-medium">
								<div class="flex items-center justify-between bg-zinc-900/30 border border-zinc-900/60 rounded-md px-3 py-2.5 shadow-inner">
									<span class="text-zinc-300 font-medium">
										Client Mods Menu
									</span>
									<kbd class="font-mono text-[11px] font-bold px-2 py-0.5 rounded border border-cyan-500/30 bg-cyan-950/40 text-cyan-400 shadow-[0_0_12px_rgba(0,245,255,0.15)] animate-pulse">
										Right Shift
									</kbd>
								</div>

								<div class="flex items-center justify-between border border-zinc-900/40 rounded-md px-3 py-2 bg-zinc-950/20">
									<span class="text-zinc-400">Toggle Sprint</span>
									<kbd class="font-mono text-[11px] font-bold px-2 py-0.5 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">
										R
									</kbd>
								</div>

								<div class="flex items-center justify-between border border-zinc-900/40 rounded-md px-3 py-2 bg-zinc-950/20">
									<span class="text-zinc-400">Camera Zoom</span>
									<kbd class="font-mono text-[11px] font-bold px-2 py-0.5 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">
										C
									</kbd>
								</div>

								<div class="flex items-center justify-between border border-zinc-900/40 rounded-md px-3 py-2 bg-zinc-950/20">
									<span class="text-zinc-400">Perspective Freelook</span>
									<kbd class="font-mono text-[11px] font-bold px-2 py-0.5 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">
										F
									</kbd>
								</div>

								<div class="flex items-center justify-between border border-zinc-900/40 rounded-md px-3 py-2 bg-zinc-950/20">
									<span class="text-zinc-400">Toggle Debug/FPS</span>
									<kbd class="font-mono text-[11px] font-bold px-2 py-0.5 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">
										F3
									</kbd>
								</div>
							</div>
						</div>

						<div class="text-[10px] text-zinc-600 font-medium pt-6 flex flex-col gap-0.5 items-start">
							<span>Astra Client by BarneyTheGod</span>
							<span>Powered by EaglercraftX by lax1dude</span>
						</div>
					</div>

				</div>

				<button id="launch-btn" class="w-full inline-flex items-center justify-center rounded-lg bg-white px-4 py-3 text-sm font-bold text-black transition-all hover:bg-zinc-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-blue tracking-tight mt-2">
					Launch
				</button>

			</div>
		</div>

	</body>
</html>
