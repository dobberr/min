<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
        <title>Project Mineral</title>
        
        <script src="https://cdn.tailwindcss.com"></script>
        <script type="text/javascript" src="classes.js" defer></script>

        <style>
            body, html { 
                background-color: #000; margin: 0; width: 100%; height: 100%; 
                overflow: hidden; user-select: none; -webkit-user-select: none;
            }
            
            /* The Layout Fix: Flexbox keeps header/footer fixed, center scrolls */
            .modal-container {
                display: flex;
                flex-direction: column;
                height: 100%;
                overflow: hidden;
            }

            .scroll-area {
                flex-grow: 1;
                overflow-y: auto;
                padding-right: 8px;
            }

            .page-transition { transition: opacity 0.4s ease-in-out, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
            
            /* Custom Scrollbar */
            .scroll-area::-webkit-scrollbar { width: 4px; }
            .scroll-area::-webkit-scrollbar-track { background: transparent; }
            .scroll-area::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        </style>
    </head>
    <body id="game_frame">
    
    <script type="application/json" id="mineral-config">
    {
      "clientName": "Mineral",
      "clientSubtitle": "The highly-optimized, community-focused educational block simulation platform.",
      "countdownTitle": "Preparing Mineral",
      "version": "1.0.1",
      "changelog": [
        { "version": "1.0.1", "date": "Jan 12, 2026", "notes": [ "Improve countdown screen", "Improve the very screen your eyes lay upon currently (this)" ] },
        { "version": "1.0.0 Release", "date": "Jan 12, 2026", "notes": [ "Initial Release of Mineral Project" ] },
        { "version": "1.0.0 Beta", "date": "Jan 7, 2026", "notes": [ "Initial Beta Release" ] }
      ],
      "team": [
        { "name": "Dobberr", "role": "Lead Developer" },
        { "name": "rapid.fast", "role": "Developer" }
      ],
      "eaglercraftOpts": {
        "container": "game_frame",
        "assetsURI": "assets.epk",
        "localesURI": "lang/",
        "worldsDB": "worlds",
        "servers": [{ "addr": "wss://smp.fluxis.xyz", "name": "Mineral - SMP" }],
        "relays": [{ "addr": "wss://relay.lax1dude.net/", "primary": true }]
      }
    }
    </script>
    
    <script type="text/javascript">
        "use strict";
        
        window.addEventListener("load", () => {
            const config = JSON.parse(document.getElementById('mineral-config').textContent);
            let overlay, contentContainer;

            function initInteractiveLoader() {
                overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center z-[9000]';
                
                contentContainer = document.createElement('div');
                contentContainer.className = 'w-11/12 max-w-4xl h-[75vh] relative';
                overlay.appendChild(contentContainer);
                document.body.appendChild(overlay);

                renderWelcome();
            }

            function renderWelcome() {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl h-full modal-container page-transition opacity-0 scale-95';
                
                const changelogHtml = config.changelog.map(i => `
                    <div class="p-3 rounded-lg bg-zinc-950/50 border border-zinc-800/50 mb-3">
                        <h4 class="text-sm font-bold text-zinc-100 flex justify-between">
                            ${i.version} <span class="text-[10px] text-zinc-500 font-mono">${i.date}</span>
                        </h4>
                        <ul class="text-zinc-400 text-xs mt-1 list-disc list-inside">${i.notes.map(n => `<li>${n}</li>`).join('')}</ul>
                    </div>`).join('');

                card.innerHTML = `
                    <div class="p-8 border-b border-zinc-800 flex justify-between items-start">
                        <div>
                            <h2 class="text-3xl font-black text-white tracking-tight">${config.clientName}</h2>
                            <p class="text-zinc-500 text-sm mt-1">${config.clientSubtitle}</p>
                        </div>
                        <div class="bg-zinc-100 text-zinc-900 px-3 py-1 rounded text-xs font-bold tracking-tighter">
                            VER ${config.version}
                        </div>
                    </div>
                    
                    <div class="scroll-area p-8">
                        <div class="mb-8">
                            <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4">Latest Updates</h3>
                            ${changelogHtml}
                        </div>
                        
                        <div>
                            <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4">Development</h3>
                            <div class="grid grid-cols-2 gap-4">
                                ${config.team.map(m => `
                                    <div class="bg-zinc-800/50 p-4 rounded-xl border border-zinc-700/30">
                                        <p class="font-bold text-zinc-100">${m.name}</p>
                                        <p class="text-[10px] text-zinc-500 uppercase font-bold">${m.role}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-6 bg-zinc-950/50 border-t border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="text-zinc-500 text-[11px] font-medium tracking-tight">
                            <span class="font-bold text-zinc-200">Astra Client</span> by <span class="font-bold text-zinc-200">BarneyTheGod</span>
                            <span class="mx-2 text-zinc-700">•</span>
                            Powered by <span class="font-bold text-zinc-200">EaglercraftX</span> by <span class="font-bold text-zinc-200">lax1dude</span>
                        </div>
                        
                        <button id="launchBtn" class="w-full sm:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg transition-all active:scale-95">
                            Launch Project
                        </button>
                    </div>
                `;
                
                contentContainer.innerHTML = '';
                contentContainer.appendChild(card);
                
                requestAnimationFrame(() => {
                    card.classList.replace('opacity-0', 'opacity-100');
                    card.classList.replace('scale-95', 'scale-100');
                });

                document.getElementById('launchBtn').onclick = () => {
                    // Start countdown logic here
                    overlay.style.opacity = '0';
                    setTimeout(() => { overlay.remove(); if(typeof main === 'function') main(); }, 500);
                };
            }

            initInteractiveLoader();
        });
    </script>
    </body>
</html>
