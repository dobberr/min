<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
        <meta name="description" content="An Educational Block-Style Simulation Platform" />
        <meta name="keywords" content="educational platform, block-style, simulation, mineral" />
        
        <!-- Tab Spoofing Logic -->
        <script type="text/javascript">
            const spoofOptions = [
                { title: "Google", icon: "https://www.google.com/favicon.ico" },
                { title: "Google Classroom", icon: "https://www.gstatic.com/classroom/favicon.png" },
                { title: "Google Drive", icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" },
                { title: "Google Docs", icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" },
                { title: "My Drive - Google Drive", icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" },
                { title: "Inbox (1) - Gmail", icon: "https://ssl.gstatic.com/ui/v1/icons/mail/images/2/itp/favicon_generic.ico" },
                { title: "Google Slides", icon: "https://ssl.gstatic.com/docs/presentations/images/apps-presentations-featured-32.png" }
            ];
            const selectedSpoof = spoofOptions[Math.floor(Math.random() * spoofOptions.length)];
            document.title = selectedSpoof.title;
            const link = document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/x-icon';
            link.href = selectedSpoof.icon;
            document.head.appendChild(link);
        </script>
        
        <meta property="og:locale" content="en-US" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Project Mineral" />
        <meta property="og:description" content="An Educational Block-Style Simulation Platform" />

        <!-- Scripts -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script type="text/javascript" src="classes.js"></script>

        <style>
            body, html { 
                background-color: #000; 
                margin: 0; 
                width: 100%; 
                height: 100%; 
                overflow: hidden; 
                user-select: none; 
            }
            #game_frame {
                width: 100%;
                height: 100%;
                display: block;
            }
            .page-transition { transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; }
            
            @keyframes pulse-flash {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.1); opacity: 0.8; }
                100% { transform: scale(1); opacity: 1; }
            }
            .animate-flash { animation: pulse-flash 0.3s ease-out; }
            
            .custom-scrollbar::-webkit-scrollbar { width: 8px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: #09090b; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
        </style>

        <script type="text/javascript">
            function createModal(content, onConfirm) {
                document.querySelectorAll('.custom-modal-overlay').forEach(el => el.remove());
                const overlay = document.createElement('div');
                overlay.className = 'custom-modal-overlay fixed inset-0 bg-zinc-950/90 flex items-center justify-center z-[100] transition-opacity duration-300 opacity-0 backdrop-blur-sm';
                const modal = document.createElement('div');
                modal.className = 'bg-zinc-900 text-zinc-50 p-6 rounded-xl shadow-2xl max-w-sm w-11/12 border border-zinc-800 transform scale-95 transition-all duration-300';
                modal.innerHTML = `<p class="mb-6 text-zinc-300">${content}</p>`;
                const btn = document.createElement('button');
                btn.className = 'w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors';
                btn.innerText = 'OK';
                btn.onclick = () => {
                    overlay.classList.replace('opacity-100', 'opacity-0');
                    setTimeout(() => { overlay.remove(); if(onConfirm) onConfirm(); }, 300);
                };
                modal.appendChild(btn);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                setTimeout(() => { overlay.classList.replace('opacity-0', 'opacity-100'); modal.classList.replace('scale-95', 'scale-100'); }, 10);
            }
            window.customAlert = (msg) => new Promise(res => createModal(msg, res));
        </script>
    </head>
    <body id="game_frame">
    
    <script type="application/json" id="mineral-config">
    {
      "clientName": "Mineral",
      "clientSubtitle": "The highly-optimized, community-focused educational block simulation platform.",
      "countdownTitle": "Preparing Mineral",
      "version": "1.0.0",
      "changelog": [
        { 
          "version": "v1.0.0 Release", 
          "date": "Jan 12, 2026", 
          "notes": [
            "Initial Release of Mineral Project"
          ] 
        },
        { 
          "version": "v1.0.0 Beta", 
          "date": "Jan 7, 2026", 
          "notes": [
            "Initial Beta Release"
          ] 
        }
      ],
      "team": [
        { "name": "Dobberr", "role": "Lead Developer" },
        { "name": "rapid.fast", "role": "Developer" },
        { "name": "Mineral Community", "role": "Testing" }
      ],
      "eaglercraftOpts": {
        "demoMode": false,
        "container": "game_frame",
        "assetsURI": "assets.epk",
        "localesURI": "lang/",
        "worldsDB": "worlds",
        "logInvalidCerts": true,
        "crashOnUncaughtExceptions": true,
        "servers": [
          { "addr": "wss://smp.fluxis.xyz", "name": "Mineral - SMP" },
          { "addr": "wss://adderall.ir", "name": "AdderallMC" },
          { "addr": "wss://mc.voidsent.net", "name": "Voidsent MC" },
          { "addr": "wss://mc.lamplifesteal.xyz", "name": "Lamp Network" },
          { "addr": "wss://vanillamc.org", "name": "VanillaMC" },
          { "addr": "wss://tuff.ws", "name": "TuffNET" }
        ],
        "relays": [
          { "addr": "wss://relay.deev.is/", "comment": "Relay #1" },
          { "addr": "wss://relay.lax1dude.net/", "comment": "Relay #2" },
          { "addr": "wss://relay.shhnowisnottheti.me/", "comment": "Relay #3" }
        ]
      }
    }
    </script>
    
    <script type="text/javascript">
        "use strict";
        
        let overlay, contentContainer;

        window.addEventListener("load", () => {
            const config = JSON.parse(document.getElementById('mineral-config').textContent);

            if(window.location.href.indexOf("file:") === 0) {
                window.customAlert("HTTP please, do not open this file locally. Run a local HTTP server and load it via HTTP");
                return;
            }

            // Init Options
            const opts = config.eaglercraftOpts;
            const relayId = Math.floor(Math.random() * opts.relays.length);
            opts.relays.forEach((r, i) => r.primary = (i === relayId));
            window.eaglercraftXOpts = opts;

            const q = new URLSearchParams(window.location.search);
            if(q.has("server")) window.eaglercraftXOpts.joinServer = q.get("server");

            function initInteractiveLoader() {
                overlay = document.createElement('div');
                overlay.id = 'mineral_overlay';
                overlay.className = 'fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center z-[9999] transition-all duration-500';
                
                const logoContainer = document.createElement('div');
                logoContainer.className = 'mb-8 flex flex-col items-center';
                const logo = document.createElement('img');
                logo.src = 'logo.png';
                logo.className = 'h-24 md:h-32 object-contain mb-4';
                logo.onerror = () => {
                    logo.style.display = 'none';
                    const txt = document.createElement('h1');
                    txt.className = 'text-5xl font-bold text-white tracking-widest';
                    txt.innerText = config.clientName.toUpperCase();
                    logoContainer.appendChild(txt);
                };
                logoContainer.appendChild(logo);
                overlay.appendChild(logoContainer);

                contentContainer = document.createElement('div');
                contentContainer.className = 'w-11/12 max-w-4xl mx-auto flex-grow max-h-[70vh] relative';
                overlay.appendChild(contentContainer);
                document.body.appendChild(overlay);

                renderWelcome();
            }

            function renderWelcome() {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900/80 backdrop-blur p-6 md:p-10 rounded-2xl shadow-2xl h-full flex flex-col border border-zinc-800 page-transition opacity-0 scale-95';
                
                const changelogHtml = config.changelog.map(item => `
                    <div class="p-3 rounded-lg bg-zinc-800/40 border border-zinc-700/40 mb-3">
                        <h4 class="text-base font-bold text-zinc-100 flex justify-between">v${item.version} <span class="text-xs font-normal text-zinc-500">${item.date}</span></h4>
                        <ul class="list-disc list-inside text-zinc-400 text-sm mt-1">${item.notes.map(n => `<li>${n}</li>`).join('')}</ul>
                    </div>
                `).join('');

                const teamHtml = config.team.map(m => `
                    <div class="bg-zinc-800/50 p-5 rounded-xl border border-zinc-700/50 hover:bg-zinc-800 transition-colors shadow-lg text-center">
                        <p class="text-xl font-bold text-zinc-100">${m.name}</p>
                        <p class="text-sm uppercase tracking-widest text-zinc-400 font-semibold mt-1">${m.role}</p>
                    </div>
                `).join('');

                card.innerHTML = `
                    <h2 class="text-3xl font-bold mb-4 text-zinc-50">Welcome to ${config.clientName}</h2>
                    <div class="flex-grow overflow-y-auto custom-scrollbar pr-2">
                        <p class="text-lg text-zinc-400 font-light mb-6">${config.clientSubtitle}</p>
                        <h3 class="text-xl font-semibold text-zinc-50 mb-4 border-b border-zinc-800 pb-2">Recent Updates</h3>
                        ${changelogHtml}
                        <h3 class="text-xl font-semibold text-zinc-50 mb-4 mt-8 border-b border-zinc-800 pb-2">Core Contributors</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">${teamHtml}</div>
                        <div class="mt-8 pt-6 border-t border-zinc-800/50">
                            <h4 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-2">Credits & Attribution</h4>
                            <p class="text-zinc-400 text-xs">
                                <span class="font-semibold text-zinc-300">Eaglercraft</span> by lax1dude &bull; 
                                <span class="font-semibold text-zinc-300">Astra Client</span> by BarneyTheGod
                            </p>
                        </div>
                    </div>
                    <div class="flex justify-end pt-6 border-t border-zinc-800">
                        <button id="launchBtn" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg shadow-blue-900/30 transition-all hover:scale-[1.02] active:scale-95">Launch Session</button>
                    </div>
                `;
                
                contentContainer.appendChild(card);
                document.getElementById('launchBtn').onclick = (e) => {
                    e.stopPropagation();
                    startCountdown();
                };
                setTimeout(() => card.classList.replace('opacity-0', 'opacity-100'), 10);
                setTimeout(() => card.classList.replace('scale-95', 'scale-100'), 10);
            }

            function startCountdown() {
                contentContainer.innerHTML = '';
                const wrap = document.createElement('div');
                wrap.className = 'w-full h-full flex flex-col items-center justify-center p-8 bg-zinc-900 rounded-2xl border border-zinc-800 shadow-2xl';
                wrap.innerHTML = `
                    <h2 class="text-xl font-medium mb-12 text-zinc-400 tracking-wide">${config.countdownTitle}</h2>
                    <div id="count" class="text-[10rem] font-bold font-mono text-blue-500 select-none">5</div>
                    <div class="w-64 h-2 bg-zinc-800 rounded-full mt-12 overflow-hidden">
                        <div id="bar" class="h-full bg-blue-600 transition-all duration-1000 linear" style="width: 100%;"></div>
                    </div>
                    <button id="skipHint" class="mt-8 text-sm text-zinc-600 font-mono opacity-0 transition-opacity duration-500">Press any key to skip</button>
                `;
                contentContainer.appendChild(wrap);

                let count = 5;
                let hasLaunched = false;
                let countdownInterval;

                const launchGame = () => {
                    if (hasLaunched) return;
                    hasLaunched = true;
                    
                    if (countdownInterval) clearInterval(countdownInterval);
                    document.removeEventListener('keydown', skipAction);
                    document.removeEventListener('mousedown', skipAction);
                    
                    // Fade out UI
                    overlay.style.opacity = '0';
                    overlay.style.pointerEvents = 'none';
                    
                    setTimeout(() => {
                        overlay.remove();
                        // Explicitly set the container style to be sure WebGL can find dimensions
                        const frame = document.getElementById('game_frame');
                        if (frame) {
                            frame.style.width = '100vw';
                            frame.style.height = '100vh';
                        }
                        
                        console.log("Mineral: Overlay removed. Starting game loop...");
                        if (typeof main === 'function') {
                            main();
                        }
                    }, 500);
                };

                const skipAction = (e) => {
                    if (Date.now() - startTime < 500) return;
                    launchGame();
                };

                const startTime = Date.now();
                countdownInterval = setInterval(() => {
                    const cd = document.getElementById('count');
                    const bar = document.getElementById('bar');
                    const hint = document.getElementById('skipHint');
                    
                    count--;
                    
                    if(count < 0) { 
                        launchGame(); 
                        return; 
                    }
                    
                    if (cd) {
                        cd.innerText = count;
                        cd.classList.remove('animate-flash');
                        void cd.offsetWidth;
                        cd.classList.add('animate-flash');
                    }
                    
                    if (bar) bar.style.width = `${(count/5)*100}%`;
                    if (count <= 3 && hint) hint.classList.add('opacity-100');
                    
                }, 1000);

                setTimeout(() => {
                    document.addEventListener('keydown', skipAction);
                    document.addEventListener('mousedown', skipAction);
                }, 200);
            }

            initInteractiveLoader();
        });
    </script>
    </body>
</html>
