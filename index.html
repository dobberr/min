<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
        <meta name="description" content="An Educational Block-Style Simulation Platform" />
        <meta name="keywords" content="educational platform, block-style, simulation, mineral" />
        
        <script type="text/javascript">
            (function() {
                const spoofs = [
                    { t: "Google", i: "https://www.google.com/favicon.ico" },
                    { t: "Google Classroom", i: "https://www.gstatic.com/classroom/favicon.png" },
                    { t: "Google Drive", i: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" },
                    { t: "Google Docs", i: "https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" },
                    { t: "My Drive - Google Drive", i: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" },
                    { t: "Inbox (1) - Gmail", i: "https://ssl.gstatic.com/ui/v1/icons/mail/images/2/itp/favicon_generic.ico" },
                    { t: "Google Slides", i: "https://ssl.gstatic.com/docs/presentations/images/apps-presentations-featured-32.png" }
                ];
                const s = spoofs[Math.floor(Math.random() * spoofs.length)];
                document.title = s.t;
                const link = document.createElement('link');
                link.rel = 'icon'; link.type = 'image/x-icon'; link.href = s.i;
                document.head.appendChild(link);
            })();
        </script>
        
        <meta property="og:locale" content="en-US" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Project Mineral" />
        <meta property="og:description" content="An Educational Block-Style Simulation Platform" />

        <script src="https://cdn.tailwindcss.com"></script>
        <script type="text/javascript" src="classes.js" defer></script>

        <style>
            body, html { 
                background-color: #000; margin: 0; width: 100%; height: 100%; 
                overflow: hidden; user-select: none; -webkit-user-select: none;
            }
            #game_frame { display: block; width: 100%; height: 100%; }
            
            /* UI Animations */
            .page-transition { transition: opacity 0.4s ease-in-out, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
            @keyframes pulse-flash {
                0% { transform: scale(1); opacity: 1; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
                50% { transform: scale(1.05); opacity: 0.9; text-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
                100% { transform: scale(1); opacity: 1; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
            }
            .animate-flash { animation: pulse-flash 0.2s ease-out; }
            
            /* Scrollbar */
            .custom-scrollbar::-webkit-scrollbar { width: 6px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: rgba(9, 9, 11, 0.5); }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
        </style>

        <script type="text/javascript">
            // Optimized Modal System
            window.customAlert = (msg) => new Promise(resolve => {
                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[99999] transition-opacity duration-300 opacity-0';
                overlay.innerHTML = `
                    <div class="bg-zinc-900 text-zinc-100 p-6 rounded-xl shadow-2xl max-w-sm w-full border border-zinc-800 transform scale-95 transition-all duration-300">
                        <p class="mb-6 text-zinc-300 font-medium">${msg}</p>
                        <button class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-colors shadow-lg shadow-blue-900/20">OK</button>
                    </div>`;
                
                const close = () => {
                    overlay.classList.remove('opacity-100');
                    setTimeout(() => { overlay.remove(); resolve(); }, 300);
                };
                
                overlay.querySelector('button').onclick = close;
                document.body.appendChild(overlay);
                
                // Trigger animation
                requestAnimationFrame(() => {
                    overlay.classList.add('opacity-100');
                    overlay.firstElementChild.classList.replace('scale-95', 'scale-100');
                });
            });
        </script>
    </head>
    <body id="game_frame">
    
    <script type="application/json" id="mineral-config">
    {
      "clientName": "Mineral",
      "clientSubtitle": "The highly-optimized, community-focused educational block simulation platform.",
      "countdownTitle": "Preparing Mineral",
      "version": "1.0.0",
      "changelog": [
        { 
          "version": "1.0.0 Release", 
          "date": "Jan 12, 2026", 
          "notes": [ "Initial Release of Mineral Project" ] 
        },
        { 
          "version": "1.0.0 Beta", 
          "date": "Jan 7, 2026", 
          "notes": [ "Initial Beta Release" ] 
        }
      ],
      "team": [
        { "name": "Dobberr", "role": "Lead Developer" },
        { "name": "rapid.fast", "role": "Developer" },
        { "name": "Mineral Community", "role": "Testing" }
      ],
      "eaglercraftOpts": {
        "demoMode": false,
        "container": "game_frame",
        "assetsURI": "assets.epk",
        "localesURI": "lang/",
        "worldsDB": "worlds",
        "logInvalidCerts": true,
        "crashOnUncaughtExceptions": true,
        "servers": [
          { "addr": "wss://smp.fluxis.xyz", "name": "Mineral - SMP" },
          { "addr": "wss://adderall.ir", "name": "AdderallMC" },
          { "addr": "wss://mc.voidsent.net", "name": "Voidsent MC" },
          { "addr": "wss://mc.lamplifesteal.xyz", "name": "Lamp Network" },
          { "addr": "wss://vanillamc.org", "name": "VanillaMC" },
          { "addr": "wss://tuff.ws", "name": "TuffNET" }
        ],
        "relays": [
          { "addr": "wss://relay.deev.is/", "comment": "Relay #1" },
          { "addr": "wss://relay.lax1dude.net/", "comment": "Relay #2" },
          { "addr": "wss://relay.shhnowisnottheti.me/", "comment": "Relay #3" }
        ]
      }
    }
    </script>
    
    <script type="text/javascript">
        "use strict";
        
        window.addEventListener("load", () => {
            const config = JSON.parse(document.getElementById('mineral-config').textContent);
            let overlay, contentContainer;

            // Protocol Check
            if(window.location.protocol === 'file:') {
                window.customAlert("Error: Please do not open this file locally.<br>Run a local HTTP server.");
                return;
            }

            // Init EaglerOpts
            const opts = config.eaglercraftOpts;
            opts.relays.forEach((r, i) => r.primary = (i === Math.floor(Math.random() * opts.relays.length)));
            window.eaglercraftXOpts = opts;

            // Handle URL Params
            const q = new URLSearchParams(window.location.search);
            if(q.has("server")) window.eaglercraftXOpts.joinServer = q.get("server");

            // --- UI System ---
            function initInteractiveLoader() {
                overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center z-[9000]';
                
                // Logo Section
                const logoContainer = document.createElement('div');
                logoContainer.className = 'mb-6 flex flex-col items-center animate-fade-in-down';
                const logo = document.createElement('img');
                logo.src = 'logo.png';
                logo.className = 'h-24 md:h-32 object-contain mb-4 drop-shadow-2xl';
                logo.onerror = () => {
                    logo.style.display = 'none';
                    logoContainer.innerHTML += `<h1 class="text-5xl font-black text-white tracking-widest uppercase drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">${config.clientName}</h1>`;
                };
                logoContainer.appendChild(logo);
                overlay.appendChild(logoContainer);

                contentContainer = document.createElement('div');
                contentContainer.className = 'w-11/12 max-w-4xl flex-grow max-h-[70vh] relative perspective-1000';
                overlay.appendChild(contentContainer);
                document.body.appendChild(overlay);

                renderWelcome();
            }

            function renderWelcome() {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900/90 backdrop-blur-md p-6 md:p-10 rounded-2xl shadow-2xl h-full flex flex-col border border-zinc-800 page-transition opacity-0 scale-95';
                
                // Generators
                const genChangelog = () => config.changelog.map(i => `
                    <div class="p-3 rounded-lg bg-zinc-950/50 border border-zinc-800/50 mb-3 hover:border-zinc-700 transition-colors">
                        <h4 class="text-sm font-bold text-zinc-100 flex justify-between items-center">
                            ${i.version} 
                            <span class="text-[10px] font-mono text-zinc-500 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">${i.date}</span>
                        </h4>
                        <ul class="list-disc list-inside text-zinc-400 text-xs mt-1.5 space-y-0.5 ml-1">${i.notes.map(n => `<li>${n}</li>`).join('')}</ul>
                    </div>`).join('');

                const genTeam = () => config.team.map(m => `
                    <div class="bg-zinc-800/30 p-4 rounded-xl border border-zinc-700/30 hover:bg-zinc-800/60 transition-all hover:-translate-y-1 shadow-lg text-center group">
                        <p class="text-lg font-bold text-zinc-100 group-hover:text-blue-400 transition-colors">${m.name}</p>
                        <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mt-1">${m.role}</p>
                    </div>`).join('');

                // Render Content
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4 border-b border-zinc-800 pb-4">
                        <div>
                            <h2 class="text-3xl font-bold text-zinc-50">Welcome</h2>
                            <p class="text-zinc-400 text-sm mt-1">Ready to launch ${config.clientName}?</p>
                        </div>
                        <div class="flex flex-col items-end">
                             <span class="px-3 py-1 rounded-full bg-blue-900/20 text-blue-400 text-xs font-mono border border-blue-800/30 shadow-[0_0_10px_rgba(30,58,138,0.2)]">
                                v${config.version}
                            </span>
                        </div>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto custom-scrollbar pr-2 space-y-6">
                        <p class="text-base text-zinc-300 font-light leading-relaxed border-l-2 border-blue-500 pl-4 bg-zinc-800/20 py-2 rounded-r-lg">
                            ${config.clientSubtitle}
                        </p>
                        
                        <div>
                            <h3 class="text-sm font-bold text-zinc-500 uppercase tracking-widest mb-3">Recent Updates</h3>
                            ${genChangelog()}
                        </div>
                        
                        <div>
                            <h3 class="text-sm font-bold text-zinc-500 uppercase tracking-widest mb-3">Development Team</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${genTeam()}</div>
                        </div>

                        <div class="pt-4 border-t border-zinc-800/50 text-center">
                            <p class="text-zinc-500 text-[10px]">
                                Powered by <span class="text-zinc-400 font-bold">EaglercraftX</span> &bull; Client Modifications by <span class="text-zinc-400 font-bold">${config.team[0].name}</span>
                            </p>
                        </div>
                    </div>
                    
                    <div class="mt-6 pt-4 border-t border-zinc-800 flex justify-end">
                        <button id="launchBtn" class="px-10 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg shadow-blue-900/40 transition-all hover:scale-[1.02] active:scale-95 flex items-center gap-2 group">
                            Launch Session 
                            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                        </button>
                    </div>
                `;
                
                contentContainer.innerHTML = '';
                contentContainer.appendChild(card);
                
                // Animation Entry
                requestAnimationFrame(() => {
                    card.classList.replace('opacity-0', 'opacity-100');
                    card.classList.replace('scale-95', 'scale-100');
                });

                document.getElementById('launchBtn').onclick = (e) => {
                    e.stopPropagation();
                    startCountdown();
                };
            }

            function startCountdown() {
                // Countdown UI
                const wrap = document.createElement('div');
                wrap.className = 'w-full h-full flex flex-col items-center justify-center p-8 bg-zinc-900/95 backdrop-blur rounded-2xl border border-zinc-800 shadow-2xl transition-all';
                wrap.innerHTML = `
                    <h2 class="text-xl font-medium mb-10 text-zinc-400 tracking-wide uppercase">${config.countdownTitle}</h2>
                    <div class="relative">
                        <div id="count" class="text-[8rem] leading-none font-bold font-mono text-blue-500 select-none drop-shadow-[0_0_30px_rgba(59,130,246,0.4)]">5</div>
                    </div>
                    <div class="w-64 h-1.5 bg-zinc-800 rounded-full mt-12 overflow-hidden">
                        <div id="bar" class="h-full bg-blue-500 shadow-[0_0_10px_#3b82f6] transition-all duration-1000 ease-linear" style="width: 100%;"></div>
                    </div>
                    <button id="skipHint" class="mt-8 text-xs text-zinc-600 font-mono opacity-0 transition-opacity duration-500 hover:text-zinc-400 cursor-pointer">
                        [ PRESS ANY KEY TO SKIP ]
                    </button>
                `;
                
                // Smooth transition between cards
                contentContainer.firstElementChild.style.opacity = '0';
                contentContainer.firstElementChild.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    contentContainer.innerHTML = '';
                    contentContainer.appendChild(wrap);
                }, 300);

                let count = 5;
                let active = true;
                
                const finish = () => {
                    if(!active) return;
                    active = false;
                    
                    // Cleanup Listeners
                    document.removeEventListener('keydown', finish);
                    document.removeEventListener('mousedown', finish);
                    
                    // Fade out
                    overlay.style.opacity = '0';
                    overlay.style.pointerEvents = 'none';
                    
                    setTimeout(() => {
                        overlay.remove();
                        const frame = document.getElementById('game_frame');
                        if (frame) { frame.style.width = '100vw'; frame.style.height = '100vh'; }
                        
                        // Safety Check: Ensure Engine Loaded
                        const tryLaunch = () => {
                            if (typeof main === 'function') {
                                console.log("Mineral: Launching Main...");
                                main();
                            } else {
                                console.warn("Mineral: Engine not ready, retrying...");
                                setTimeout(tryLaunch, 100);
                            }
                        };
                        tryLaunch();
                    }, 500);
                };

                const timer = setInterval(() => {
                    if(!active) { clearInterval(timer); return; }
                    count--;
                    
                    if(count < 0) { clearInterval(timer); finish(); return; }

                    const el = document.getElementById('count');
                    const bar = document.getElementById('bar');
                    const hint = document.getElementById('skipHint');

                    if(el) {
                        el.innerText = count;
                        el.classList.remove('animate-flash');
                        void el.offsetWidth; // Trigger reflow
                        el.classList.add('animate-flash');
                    }
                    if(bar) bar.style.width = `${(count/5)*100}%`;
                    if(count <= 3 && hint) hint.classList.replace('opacity-0', 'opacity-100');

                }, 1000);

                // Skip Listeners (Delayed slightly to prevent accidental skips)
                setTimeout(() => {
                    document.addEventListener('keydown', finish);
                    document.addEventListener('mousedown', finish);
                }, 500);
            }

            initInteractiveLoader();
        });
    </script>
    </body>
</html>
